[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
    ; MAVLink library - search alternatives with: pio lib search "mavlink"
    ; If automatic resolution fails, clone the C library v2 headers into lib/mavlink/
    mavlink
    sensirion/Sensirion I2C SEN66 @ ^1.0.0

monitor_speed = 115200
upload_speed = 921600
